<style>
/* Layout: an exam booklet on graph paper. One question per screen, answer-sheet bubbles below, scratch paper under every question. */
:root {
  --paper: #f6f8fb;
  --surface: #ffffff;
  --ink: #17233a;
  --muted: #5b687d;
  --line: #d7dee8;
  --grid: rgba(40, 90, 170, .07);
  --accent: #1f56c4;
  --accent-ink: #ffffff;
  --marker: #ffd43b;
  --marker-ink: #2a2100;
  --good: #17845a;
  --bad: #c3372b;
  --sheet: #ffffff;
  --sheet-grid: rgba(31, 86, 196, .12);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", "Consolas", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1620; --surface: #17212e; --ink: #e7edf5; --muted: #95a3b7; --line: #2b3848;
    --grid: rgba(120, 170, 255, .06); --accent: #6ea4ff; --accent-ink: #0b1626; --marker: #f2c522; --marker-ink: #231b00;
    --good: #45c38c; --bad: #ff7b6f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1620; --surface: #17212e; --ink: #e7edf5; --muted: #95a3b7; --line: #2b3848;
  --grid: rgba(120, 170, 255, .06); --accent: #6ea4ff; --accent-ink: #0b1626; --marker: #f2c522; --marker-ink: #231b00;
  --good: #45c38c; --bad: #ff7b6f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font: 16px/1.5 var(--f-body);
  padding-inline: 16px; padding-block: 0 40px;
}
.wrap { max-width: 860px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .6rem 1rem; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: .3rem 0; }

/* ---------- home ---------- */
.masthead { padding-block: 28px 18px; display: grid; gap: 6px; }
.masthead h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; line-height: 1; }
.masthead h1 span { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); padding-inline: 2px; }
.masthead p { margin: 0; color: var(--muted); max-width: 60ch; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 14px 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: .35rem .9rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.who input { border: 1.5px dashed var(--line); background: transparent; border-radius: 999px; padding: .35rem .9rem; width: 9.5rem; font: inherit; color: var(--ink); }
.levels { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: thin; }
.lv { flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .5rem .8rem; text-align: left; }
.lv b { display: block; font-family: var(--f-display); font-size: 1.05rem; }
.lv small { color: var(--muted); }
.lv[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.yr { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .8rem; text-align: left; display: grid; gap: 4px; min-height: 92px; }
.yr .y { font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; line-height: 1; }
.yr .st { font-size: .85rem; color: var(--muted); }
.yr .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.yr .bar i { display: block; height: 100%; background: var(--accent); }
.yr.done .st { color: var(--good); font-weight: 700; }
.note { color: var(--muted); font-size: .88rem; margin-top: 22px; max-width: 70ch; }
.quiz { margin-top: 14px; background: var(--surface); border: 1.5px solid var(--line); border-left: 5px solid var(--marker); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.quiz h3 { font-size: 1.25rem; }
.quiz .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.quiz .row .label { min-width: 5.5rem; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stepper button { border: 0; background: var(--paper); width: 42px; height: 42px; font-weight: 800; font-size: 1.2rem; }
.stepper input { width: 4.2rem; height: 42px; border: 0; border-inline: 1.5px solid var(--line); text-align: center; font: 600 1.1rem var(--f-mono); background: var(--surface); color: var(--ink); -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.quiz .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- test ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px 8px; border-bottom: 1.5px solid var(--line); display: grid; gap: 8px; }
.toprow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toprow h2 { font-size: 1.15rem; flex: 1 1 auto; min-width: 0; }
.pts { border-radius: 6px; padding: .1rem .5rem; font-weight: 700; font-size: .85rem; background: var(--marker); color: var(--marker-ink); }
.strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.dot { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font: 600 .85rem var(--f-mono); }
.dot.ans { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot.skip { border-style: dashed; color: var(--muted); }
.dot.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
.dot.ok { background: var(--good); border-color: var(--good); color: #fff; }
.dot.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-block: 12px 8px; }
.tool { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 42px; height: 42px; padding: 0 .6rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.tool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.swatch { width: 18px; height: 18px; border-radius: 50%; display: inline-block; border: 2px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
.tool.sw[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--accent); }
.sheet { position: relative; background: var(--sheet); border-radius: var(--r); border: 1.5px solid var(--line); overflow: hidden; }
.sheet canvas { display: block; width: 100%; }
.scratch { background-color: var(--sheet); background-image: linear-gradient(var(--sheet-grid) 1px, transparent 1px), linear-gradient(90deg, var(--sheet-grid) 1px, transparent 1px); background-size: 20px 20px; border-top: 1.5px dashed #c9d3e2; position: relative; }
.scratch span { position: absolute; left: 10px; top: 6px; font: 700 .7rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: #8a97ab; }
#ink { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
#ink.drawing { touch-action: none; cursor: crosshair; }
.loading { padding: 40px; text-align: center; color: #5b687d; }
.choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
.ch { height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font: 800 1.5rem var(--f-display); }
.ch[aria-pressed="true"] { background: var(--marker); color: var(--marker-ink); border-color: var(--marker-ink); }
.ch.right { background: var(--good); border-color: var(--good); color: #fff; }
.ch.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.ch:disabled { cursor: default; }
.submitbar { margin-top: 14px; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.submitbar .msg { flex: 1 1 220px; min-width: 0; }
.submitbar .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hintbar { margin-top: 10px; border: 1.5px dashed var(--line); border-left: 5px solid var(--marker); background: var(--surface); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; }
.hintbar .hrow { display: flex; gap: 10px; align-items: baseline; }
.hintbar .hrow b { flex: none; background: var(--marker); color: var(--marker-ink); border-radius: 6px; padding: .05rem .45rem; font-size: .85rem; }
.hintbar .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.subnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.src { font-size: .82rem; color: var(--muted); }
.src a { color: var(--muted); }

/* ---------- results ---------- */
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-block: 16px; }
.score div { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; }
.score b { display: block; font: 800 2rem var(--f-display); line-height: 1.1; }
.revgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.rev { border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); padding: 6px; text-align: left; font-size: .85rem; }
.rev b { font-family: var(--f-mono); }
.rev.ok { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.rev.no { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.rev.sk { border-style: dashed; }
@media (max-width: 520px) {
  .ch { height: 54px; font-size: 1.3rem; }
  .tool { min-width: 40px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

,"year":2020,"level":"Felix","w":1049,"q":[{"y":0,"h":286,"p":1,"a":"B","pts":3,"s":0,"hn":["Put one finger on the kangaroo and one on the rabbit. Move them at the same time: kangaroo up three steps, rabbit down two.","Count how many jumps the kangaroo needs to reach step 9. The rabbit takes the same number of jumps down from step 10, two steps each time."]},{"y":286,"h":342,"p":1,"a":"C","pts":3,"s":0,"hn":["The piece at the very bottom went down first. Find a piece that has nothing lying on top of it except other pieces.","The square is under everything, so it went first. Now look at which piece is lying right on top of the square's corner."]},{"y":628,"h":713,"p":1,"a":"E","pts":3,"s":0,"hn":["Look at which way the car's smiling face points in the big picture. Then look for a boy standing in front of the car.","Cross out the pictures where the boy is behind or on top of the car. Of the two left, pick the car whose face points the same way as the big one."]},{"y":1341,"h":243,"p":2,"a":"C","pts":3,"s":0,"hn":["Try a guess. Say he was right one time and wrong the other days. Count the coins he wins and the coins he pays.","You need the coins won to be exactly the same as the coins paid. Keep the five days, and try one more right day each time until the two piles match."]},{"y":1584,"h":310,"p":2,"a":"A","pts":3,"s":0,"hn":["Touch each animal in the picture and count out loud: 1, 2, 3... Keep going past the end by starting the pattern again.","Every five animals the pattern starts over at the rat. Count rounds of five: 5, 10, then count on four more animals from the start."]},{"y":1894,"h":322,"p":2,"a":"C","pts":3,"s":0,"hn":["Count Ana's cards one shape at a time: all the circles, then all the triangles, then all the squares.","Now count each shape in the tower too. Take away: how many circles are left over, how many triangles, how many squares?"]},{"y":2216,"h":141,"p":2,"a":"B","pts":3,"s":0,"hn":["First count all the cubes: how many in the front wall, and is there a second wall behind it?","Half of all the cubes are white. Count the white cubes you can see on the front, the top and the side, and take that away from the number of white cubes."]},{"y":2357,"h":399,"p":2,"a":"D","pts":3,"s":0,"hn":["Pick one picture. Count the squares, and remember a square turned on its corner is still a square. Then count the triangles.","You want a picture where the triangles win. Check each picture and see which one has more triangles than squares."]},{"y":2756,"h":258,"p":3,"a":"E","pts":4,"s":0,"hn":["Look at the gray ovals in the corners of each small tile. Where do they sit?","On the wall, when a tile has two ovals they are in opposite corners. Find the answer tile whose two ovals are next to each other."]},{"y":3014,"h":196,"p":3,"a":"D","pts":4,"s":0,"hn":["Pick one straight street and run your finger along it, counting the houses. Do this for each straight street.","Find the straight street with only two houses, then the round street with only two houses. Which letter sits on both of them?"]},{"y":3210,"h":235,"p":3,"a":"A","pts":4,"s":0,"hn":["Count the cubes in each block. A cube on top needs a cube under it, even if you cannot see it.","Count block A carefully: the tall tower and the cubes beside it. Then check that every other block has more."]},{"y":3445,"h":284,"p":3,"a":"D","pts":4,"s":0,"hn":["Add up all the numbers on the front flower first.","Double the front flower's total. Then add the back flower's petals you can see, and work out what is missing to reach the doubled number."]},{"y":3729,"h":435,"p":3,"a":"B","pts":4,"s":0,"hn":["Find the shape that shows up in both pictures of the cube.","Write down every shape that one shape touches in both pictures. The only shape it never touches is on the opposite side."]},{"y":0,"h":168,"p":4,"a":"B","pts":4,"s":1,"hn":["Try filling the boxes with any numbers that make three in a row add to 10, starting with the 2.","Look at boxes 1, 2, 3 and boxes 2, 3, 4. They share the two middle boxes. What does that tell you about box 4 compared to box 1?"]},{"y":168,"h":381,"p":4,"a":"D","pts":4,"s":1,"hn":["Take a piece of paper, draw a big L on it, and flip it over the top edge, then over the side edge. Compare the two.","Flipping it that way turns the picture all the way round, like a wheel turning half a circle. Where do the head, tail and skateboard end up?"]},{"y":549,"h":178,"p":4,"a":"E","pts":4,"s":1,"hn":["Pretend you are Grandma. Give each of the six children one cupcake, then another, and keep track of how many you have used.","Keep giving out rounds of six until you cannot give everyone one more. How many cupcakes are still on the plate?"]},{"y":727,"h":293,"p":4,"a":"E","pts":5,"s":1,"hn":["The gray box is in a row and a column. Which shapes are already used in that row and column?","The gray box's row has a square and a 1. Its column has a square and a 2. What shape and number are still missing?"]},{"y":1020,"h":395,"p":4,"a":"A","pts":5,"s":1,"hn":["Wagon 7 is beside wagon 12. Move one train along by one wagon. Which numbers are side by side now?","Make a list: 7 with 12, 8 with 11, 9 with ... Keep going one step at a time and see which wagon ends up beside 11."]},{"y":1415,"h":164,"p":5,"a":"D","pts":5,"s":1,"hn":["Draw 14 little shapes: 8 circles and the rest squares. Half of all chocolates are dark.","Color 2 of the squares dark. Now count how many more dark ones you need, and color circles for them."]},{"y":1579,"h":199,"p":5,"a":"A","pts":5,"s":1,"hn":["The three numbers you can see are all on different pairs. Each pair adds up to the same total.","Try each answer as 8's partner. Add it to 8 to get the total, then check if 4 and 5 can find partners up to 9 that are not already used."]},{"y":1778,"h":168,"p":5,"a":"E","pts":5,"s":1,"hn":["Count the chairs first: two chairs at each table.","The four girls with no boy fill some tables. Every other table has one boy and one girl. Count the girls at those tables and add the four."]},{     else { wrong++; pts -= q.pts / 4; }
  });
  return { pts, max, right, wrong, blank };
}

// ---------- random quiz: n questions drawn from every paper of one level, optionally one point value ----------
function quizPool(lv, pts) {
  const pool = [];
  TESTS.forEach(t => { if (t.level === lv) t.q.forEach((q, i) => { if (pts === 'any' || q.pts === +pts) pool.push([t.id, i]); }); });
  return pool;
}
function quizTest(def) {
  return { id: 'quiz', level: def.level, year: 'Random quiz', quiz: true,
    q: def.items.map(([tid, i]) => { const t = BY_ID[tid]; return Object.assign({}, t.q[i], { tid, tw: t.w, ty: t.year, qn: i + 1 }); }) };
}
function quizBox(lv) {
  const pts = prefs.qpts || 'any', max = quizPool(lv, pts).length;
  const n = Math.min(Math.max(1, prefs.qn || 10), max);
  const cur = prog.quiz && prog.quiz.level === lv ? prog.quiz : null;
  let resume = '';
  if (cur) {
    const t = quizTest(cur), done = Object.values(cur.ans).filter(a => a !== 'skip').length;
    resume = cur.done ? `<button class="btn" id="qresume">Last quiz: ${score(t, cur).right}/${t.q.length} right · review</button>`
      : `<button class="btn" id="qresume">Continue quiz · ${done} of ${t.q.length} answered</button>`;
  }
  return `<section class="quiz" aria-label="Random quiz">
    <div><span class="label">Random quiz · ${lvName(lv)}</span><h3>Mix questions from every ${lvName(lv)} paper</h3></div>
    <div class="row"><span class="label">Questions</span>
      <span class="stepper"><button id="qminus" aria-label="Fewer">−</button><input id="qn" type="number" inputmode="numeric" min="1" max="${max}" value="${n}" aria-label="Number of questions"><button id="qplus" aria-label="More">+</button></span>
      <span class="src">1 to ${max}</span></div>
    <div class="row" role="group" aria-label="Point level"><span class="label">Points</span>
      ${[['any', 'Any (random)'], ['3', '3 · easier'], ['4', '4 · medium'], ['5', '5 · harder']].map(([v, l]) => `<button class="chip" data-qpts="${v}" aria-pressed="${pts === v}">${l}</button>`).join('')}</div>
    <div class="row" role="group" aria-label="When to show answers"><span class="label">Answers</span>
      <button class="chip" data-mode="practice" aria-pressed="${prefs.mode === 'practice'}">After each question</button>
      <button class="chip" data-mode="test" aria-pressed="${prefs.mode === 'test'}">At the end</button></div>
    <div class="acts"><button class="btn primary" id="qgo">Start ${n}-question quiz</button>${resume}</div>
  </section>`;
}
function wireQuiz(lv) {
  const inp = app.querySelector('#qn'), max = +inp.max, go = app.querySelector('#qgo');
  const set = v => { v = Math.min(max, Math.max(1, Math.round(+v) || 1)); inp.value = v; prefs.qn = v; save('kg:prefs', prefs); go.textContent = `Start ${v}-question quiz`; };
  inp.onchange = () => set(inp.value);
  inp.oninput = () => { if (inp.value !== '') go.textContent = `Start ${Math.min(max, Math.max(1, +inp.value || 1))}-question quiz`; };
  app.querySelector('#qminus').onclick = () => set(+inp.value - 1);
  app.querySelector('#qplus').onclick = () => set(+inp.value + 1);
  app.querySelectorAll('[data-qpts]').forEach(b => b.onclick = () => { prefs.qpts = b.dataset.qpts; save('kg:prefs', prefs); home(); });
  go.onclick = () => {
    set(inp.value);
    const pool = quizPool(lv, prefs.qpts || 'any');
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    // easiest first, like a real paper; random order within each point value
    const items = pool.slice(0, prefs.qn).sort((a, b) => BY_ID[a[0]].q[a[1]].pts - BY_ID[b[0]].q[b[1]].pts);
    prog.quiz = { level: lv, items, ans: {}, done: false, elapsed: 0, mode: prefs.mode };
    save(notesKey('quiz'), {}); saveProg();
    openTest('quiz', 0);
  };
  const rs = app.querySelector('#qresume'); if (rs) rs.onclick = () => openTest('quiz');
}

// ---------- timer ----------
let timer = null, tickFrom = 0;
function startTimer(r) { stopTimer(); tickFrom = Date.now(); timer = setInterval(() => { r.elapsed += (Date.now() - tickFrom) / 1000; tickFrom = Date.now(); const el = document.getElementById('clock'); if (el) el.textContent = fmt(r.elapsed); saveProg(); }, 1000); }
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ---------- images ----------
const imgCache = {};
function chunk(tid, k) {
  const key = tid + '_' + k;
  if (!imgCache[key]) imgCache[key] = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'img/' + key + '.webp'; });
  return imgCache[key];
}

function single(name) {
  if (!imgCache[name]) imgCache[name] = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'img/' + name + '.webp'; });
  return imgCache[name];
}

// ---------- test view ----------
let T = null, R = null, qi = 0, pending = null, confirming = false, review = false;
let drawOn = window.matchMedia('(min-width: 700px)').matches, tool = 'pen', inkIdx = 0;
let notes = {};

function openTest(tid, startAt) {
  T = tid === 'quiz' ? quizTest(prog.quiz) : BY_ID[tid]; R = rec(tid); review = R.done;
  if (!R.done) R.mode = prefs.mode;

}
function firstOpen() { for (let i = 0; i < T.q.length; i++) if (!R.ans[i]) return i; return 0; }
function lvName(l) { return l === 'Ecolier' ? 'Écolier' : l; }
function feedbackShown(i) { return review || (R.mode === 'practice' && R.ans[i] && R.ans[i] !== 'skip'); }

function renderQ() {
  pending = null; confirming = false;
  const q = T.q[qi], n = T.q.length, given = R.ans[qi];
  const locked = !!given && given !== 'skip' || review;
  app.innerHTML = `
  <div class="top">
    <div class="toprow">
      <button class="btn" id="back" aria-label="Back to all papers">←</button>
      <h2>${lvName(T.level)} ${T.year} · Question <span class="mono">${qi + 1}</span> of ${n}</h2>
      <span class="pts">${q.pts} points</span>

    </div>
    ${review ? '' : `<div class="toprow"><span class="label">Answers</span>
      <button class="chip" id="showans" aria-pressed="${R.mode === 'practice'}">${R.mode === 'practice' ? 'Shown after each question' : 'Hidden until the end'}</button></div>`}

      const a = R.ans[i]; let c = 'dot';

      if (i === qi) c += ' cur';

    }).join('')}</div>
  </div>
  <div class="tools" role="toolbar" aria-label="Notes">

    ${INKS.map(([c, nm], i) => `<button class="tool sw" data-ink="${i}" aria-pressed="${tool === 'pen' && inkIdx === i}" aria-label="${nm} pen"><span class="swatch" style="background:${c}"></span></button>`).join('')}
    <button class="tool" id="eraser" aria-pressed="${tool === 'eraser'}">Eraser</button>

    <canvas id="ink"></canvas>
  </div>
  <div class="choices" role="group" aria-label="Answer choices">
    ${'ABCDE'.split('').map(L => `<button class="ch" data-ch="${L}" aria-pressed="false">${L}</button>`).join('')}
  </div>
  <div class="submitbar" id="sb"></div>
  ${q.hn && q.hn.length ? '<div class="hintbar" id="hb"></div>' : ''}
  <div class="subnav">
    <button class="btn" id="prev" ${qi === 0 ? 'disabled' : ''}>← Previous</button>
    <span class="src">${q.tid ? `From the ${q.ty} paper, question ${q.qn}. ` : ''}Picture cut off? <a href="https://www.matematica.pt/en/docs/kangaroo/enunciados/${q.ty || T.year}/${q.tid || T.id}.pdf#page=${q.p}" target="_blank" rel="noopener">Open the original page ${q.p}</a></span>
    <button class="btn" id="next" ${qi === n - 1 ? 'disabled' : ''}>Next →</button>
  </div>
  ${T.quiz && !locked ? `<div class="subnav" id="qedit"><button class="btn" id="qswap">↻ Swap for a different question</button>${n > 1 ? '<button class="btn danger" id="qdel">✕ Remove from quiz</button>' : ''}</div>` : ''}`;
  const sa = app.querySelector('#showans');
  if (sa) sa.onclick = () => { R.mode = R.mode === 'practice' ? 'test' : 'practice'; prefs.mode = R.mode; save('kg:prefs', prefs); saveProg(); renderQ(); };
  const sw = app.querySelector('#qswap');
  if (sw) sw.onclick = () => {
    // same point value keeps the easy-to-hard order; never repeat a question already in the quiz
    const have = new Set(R.items.map(it => it.join(':')));
    const pool = quizPool(T.level, String(q.pts)).filter(it => !have.has(it.join(':')));
    if (!pool.length) { sw.textContent = 'No other questions left at this level'; sw.disabled = true; return; }
    R.items[qi] = pool[Math.floor(Math.random() * pool.length)];
    delete R.ans[qi]; if (R.hints) delete R.hints[qi]; notes[qi] = []; saveNotes(); saveProg();

  if (dl) dl.onclick = () => {
    if (!dl.dataset.arm) { dl.dataset.arm = 1; dl.textContent = 'Tap again to remove'; return; }
    R.items.splice(qi, 1);
    const shift = o => { const out = {}; Object.keys(o).forEach(k => { const i = +k; if (i < qi) out[i] = o[k]; else if (i > qi) out[i - 1] = o[k]; }); return out; };
    R.ans = shift(R.ans); R.hints = shift(R.hints || {}); notes = shift(notes); saveNotes(); saveProg();
    T = quizTest(R); qi = Math.min(qi, T.q.length - 1); renderQ();
  };
  app.querySelector('#back').onclick = () => { saveProg(); home(); };
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { qi = +b.dataset.go; renderQ(); });
  app.querySelector('#prev').onclick = () => { qi--; renderQ(); };
  app.querySelector('#next').onclick = () => { qi++; renderQ(); };
  app.querySelector('#strip').querySelector('.cur')?.scrollIntoView({ block: 'nearest', inline: 'center' });
  app.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { if (locked) return; pending = b.dataset.ch; confirming = false; paintChoices(); paintSubmit(); });
  wireTools();
  paintChoices(); paintSubmit(); paintHints();
  drawQuestion();
}

// Two hints per question: the first says how to start, the second gets most of the way there.
// How many were opened is kept per test (R.hints), so they stay open when you come back.
function paintHints() {
  const hb = app.querySelector('#hb'); if (!hb) return;
  const q = T.q[qi], hs = q.hn;
  R.hints = R.hints || {};
  const shown = R.hints[qi] || 0;
  const rows = hs.slice(0, shown).map((h, i) => `<div class="hrow"><b>Hint ${i + 1}</b><span>${esc(h)}</span></div>`).join('');
  const more = shown < hs.length
    ? `<button class="btn" id="hintbtn">💡 ${shown ? 'Show hint ' + (shown + 1) : 'Need a hint?'}</button><span class="src">${shown ? 'One more hint left.' : 'Try it first. Hints are here if you get stuck.'}</span>`
    : '<span class="src">That was the last hint.</span>';
  hb.innerHTML = rows + `<div class="acts">${more}</div>`;
  const b = hb.querySelector('#hintbtn');
  if (b) b.onclick = () => { R.hints[qi] = shown + 1; saveProg(); paintHints(); };
}

function paintChoices() {
  const given = R.ans[qi], q = T.q[qi], show = feedbackShown(qi);
  const locked = !!given && given !== 'skip' || review;
  app.querySelectorAll('[data-ch]').forEach(b => {
    const L = b.dataset.ch; b.className = 'ch'; b.disabled = locked;
    b.setAttribute('aria-pressed', String(L === (locked ? given : pending)));
    if (show) { if (q.a.includes(L)) b.classList.add('right'); else if (L === given) b.classList.add('wrong'); }
  });
}

function paintSubmit() {
  const sb = app.querySelector('#sb'), q = T.q[qi], given = R.ans[qi], n = T.q.length;
  const answered = Object.keys(R.ans).filter(k => R.ans[k] !== 'skip').length;
  const finishBtn = !review ? `<button class="btn" id="finish">Finish test</button>` : `<button class="btn" id="toresults">See results</button>`;
  let html;
  if (review || (given && given !== 'skip')) {
    let msg;
    if (feedbackShown(qi)) {
      const ok = given && given !== 'skip' && q.a.includes(given);
      msg = given && given !== 'skip'
        ? `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct!' : 'Not this time.'}</span> You answered <b>${given}</b>. The answer is <b>${q.a.split('').join(' or ')}</b>.`
        : `Skipped. The answer is <b>${q.a.split('').join(' or ')}</b>.`;
    } else msg = `Answer <b>${given}</b> is locked in. ${answered} of ${n} answered.`;
    html = `<div class="msg">${msg}</div><div class="acts">${qi < n - 1 ? '<button class="btn primary" id="nextq">Next question →</button>' : ''}${finishBtn}</div>`;
  } else if (confirming) {
    html = `<div class="msg"><b>Submit ${pending} for question ${qi + 1}?</b> You can't change it after this.</div>
      <div class="acts"><button class="btn" id="cancel">Change answer</button><button class="btn primary" id="yes">Yes, submit ${pending}</button></div>`;
  } else {
    html = `<div class="msg">${pending ? `You picked <b>${pending}</b>.` : 'Tap A–E to pick an answer.'}${given === 'skip' ? ' (Skipped earlier.)' : ''}</div>
      <div class="acts"><button class="btn" id="skip">Skip for now</button><button class="btn primary" id="submit" ${pending ? '' : 'disabled'}>Submit answer</button>${finishBtn}</div>`;
  }
  sb.innerHTML = html;
  const on = (id, f) => { const el = sb.querySelector('#' + id); if (el) el.onclick = f; };
  on('submit', () => { confirming = true; paintSubmit(); });
  on('cancel', () => { confirming = false; paintSubmit(); });
  on('yes', () => {
    R.ans[qi] = pending; saveProg();
    renderQ();
    if (R.mode === 'practice') return;
    const from = qi;
    setTimeout(() => { if (qi !== from || !app.querySelector('#sb')) return; const nx = nextOpen(from); if (nx != null) { qi = nx; renderQ(); } }, 700);
  });
  on('skip', () => { if (!R.ans[qi]) R.ans[qi] = 'skip'; saveProg(); const nx = nextOpen(qi); qi = nx != null ? nx : Math.min(qi + 1, n - 1); renderQ(); });
  on('nextq', () => { qi++; renderQ(); });
  on('toresults', results);
  on('finish', () => {
    const left = n - answered;
    sb.innerHTML = `<div class="msg"><b>Finish and see your score?</b> ${left ? `${left} question${left > 1 ? 's are' : ' is'} still blank and will count as 0 points.` : 'Every question is answered.'}</div>
      <div class="acts"><button class="btn" id="keep">Keep working</button><button class="btn primary" id="fin">Yes, finish</button></div>`;
    sb.querySelector('#keep').onclick = paintSubmit;
    sb.querySelector('#fin').onclick = () => { R.done = true; saveProg(); stopTimer(); results(); };
  });
}
// next question nobody has touched yet, wrapping around; skipped ones are left for later
function nextOpen(from) {
  for (let i = from + 1; i < T.q.length; i++) if (!R.ans[i]) return i;
  for (let i = 0; i < from; i++) if (!R.ans[i]) return i;
  return null;
}

// ---------- drawing ----------
let qW = 0, qH = 0, sH = 0;
async function drawQuestion() {
  const q = T.q[qi], sheet = app.querySelector('#sheet'), qc = app.querySelector('#qc'), scratch = app.querySelector('#scratch');
  const cw = sheet.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  qW = cw; qH = Math.round(cw * (q.src ? q.sh / q.sw : q.h / (q.tw || T.w))); sH = Math.max(240, Math.round(qH * 0.7));
  qc.style.height = qH + 'px'; qc.width = Math.round(cw * dpr); qc.height = Math.round(qH * dpr);
  scratch.style.height = sH + 'px';
  sizeInk();
  const ctx = qc.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, qc.width, qc.height);
  try {
    // a few questions share a page band with a neighbour and are hand-cropped into their own file
    const im = q.src ? await single(q.src) : await chunk(q.tid || T.id, q.s);
    if (app.querySelector('#qc') !== qc) return;
    ctx.imageSmoothingQuality = 'high';
    if (q.src) ctx.drawImage(im, 0, 0, qc.width, qc.height);
    else ctx.drawImage(im, 0, q.y, q.tw || T.w, q.h, 0, 0, qc.width, qc.height);
  } catch (e) {
    ctx.fillStyle = '#5b687d'; ctx.font = `${16 * dpr}px sans-serif`;
    ctx.fillText('Picture did not load. Use the original page link below.', 12 * dpr, 30 * dpr);
  }
}
function sizeInk() {
  const ink = app.querySelector('#ink'); if (!ink) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  ink.width = Math.round(qW * dpr); ink.height = Math.round((qH + sH) * dpr);
  ink.classList.toggle('drawing', drawOn);
  redrawInk();
}
function strokes() { return notes[qi] || (notes[qi] = []); }
function saveNotes() { save(notesKey(T.id), notes); }
function redrawInk() {
  const ink = app.querySelector('#ink'); if (!ink) return;
  const c = ink.getContext('2d'), s = ink.width; c.clearRect(0, 0, ink.width, ink.height);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const st of (notes[qi] || [])) {
    c.strokeStyle = INKS[st.c][0]; c.lineWidth = st.w * s; c.beginPath();
    const p = st.p; c.moveTo(p[0] * s, p[1] * s);
    if (p.length === 2) c.lineTo(p[0] * s + .1, p[1] * s);
    for (let i = 2; i < p.length; i += 2) c.lineTo(p[i] * s, p[i + 1] * s);
    c.stroke();
  }
}
function wireTools() {
  const ink = app.querySelector('#ink');
  app.querySelector('#drawtg').onclick = () => { drawOn = !drawOn; const b = app.querySelector('#drawtg'); b.setAttribute('aria-pressed', drawOn); b.textContent = drawOn ? '✎ Writing on' : '✎ Write'; ink.classList.toggle('drawing', drawOn); };
  app.querySelectorAll('[data-ink]').forEach(b => b.onclick = () => { tool = 'pen'; inkIdx = +b.dataset.ink; if (!drawOn) app.querySelector('#drawtg').click(); paintTools(); });
  app.querySelector('#eraser').onclick = () => { tool = tool === 'eraser' ? 'pen' : 'eraser'; if (!drawOn) app.querySelector('#drawtg').click(); paintTools(); };
  app.querySelector('#undo').onclick = () => { strokes().pop(); saveNotes(); redrawInk(); };
  const clr = app.querySelector('#clear');
  clr.onclick = () => {
    if (clr.dataset.arm) { notes[qi] = []; saveNotes(); redrawInk(); delete clr.dataset.arm; clr.textContent = 'Clear notes'; clr.classList.remove('danger'); return; }
    clr.dataset.arm = '1'; clr.textContent = 'Tap again to clear'; clr.classList.add('danger');
    setTimeout(() => { if (clr.isConnected && clr.dataset.arm) { delete clr.dataset.arm; clr.textContent = 'Clear notes'; clr.classList.remove('danger'); } }, 3000);
  };
  let cur = null, penSeen = false;
  const pt = e => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.width]; };
  ink.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeen = true;
    if (!drawOn) return;
    if (penSeen && e.pointerType === 'touch') return;   // palm rejection once a stylus is used
    e.preventDefault(); ink.setPointerCapture(e.pointerId);
    const p = pt(e);
    if (tool === 'eraser') { erase(p); cur = { erasing: true }; return; }
    cur = { c: inkIdx, w: 0.0045, p: [+p[0].toFixed(4), +p[1].toFixed(4)] }; strokes().push(cur); redrawInk();
  });
  ink.addEventListener('pointermove', e => {
    if (!cur) return; e.preventDefault();
    const p = pt(e);
    if (cur.erasing) { erase(p); return; }
    cur.p.push(+p[0].toFixed(4), +p[1].toFixed(4));
    const c = ink.getContext('2d'), s = ink.width, n = cur.p.length;
    c.strokeStyle = INKS[cur.c][0]; c.lineWidth = cur.w * s; c.lineCap = 'round';
    c.beginPath(); c.moveTo(cur.p[n - 4] * s, cur.p[n - 3] * s); c.lineTo(cur.p[n - 2] * s, cur.p[n - 1] * s); c.stroke();
  });
  const end = () => { if (cur) { cur = null; saveNotes(); } };
  ink.addEventListener('pointerup', end); ink.addEventListener('pointercancel', end);
}
function erase(p) {
  const list = strokes(), r = 0.02; let hit = false;
  for (let i = list.length - 1; i >= 0; i--) {
    const q = list[i].p;
    for (let j = 0; j < q.length; j += 2) if (Math.hypot(q[j] - p[0], q[j + 1] - p[1]) < r) { list.splice(i, 1); hit = true; break; }
  }
  if (hit) redrawInk();
}
function paintTools() {
  app.querySelectorAll('[data-ink]').forEach(b => b.setAttribute('aria-pressed', String(tool === 'pen' && inkIdx === +b.dataset.ink)));
  app.querySelector('#eraser').setAttribute('aria-pressed', String(tool === 'eraser'));
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (app.querySelector('#qc')) drawQuestion(); }, 150); });

// ---------- results ----------
function results() {
  stopTimer(); review = true;
  const s = score(T, R);
  app.innerHTML = `
  <div class="top"><div class="toprow"><button class="btn" id="back" aria-label="Back to all papers">←</button><h2>${lvName(T.level)} ${T.year} · Results for ${esc(prefs.who)}</h2></div></div>
  <section class="score">
    <div><span class="label">Correct</span><b class="mono">${s.right}/${T.q.length}</b></div>
    <div><span class="label">Kangaroo score</span><b class="mono">${+s.pts.toFixed(2)}</b><span class="src">out of ${s.max}</span></div>
    <div><span class="label">Wrong · blank</span><b class="mono">${s.wrong} · ${s.blank}</b></div>
    <div><span class="label">Time</span><b class="mono">${fmt(R.elapsed)}</b></div>
  </section>
  <p class="src">Kangaroo scoring: you start with ${T.q.length} points, gain 3, 4 or 5 per correct answer, lose a quarter of the question's value for a wrong answer, and blanks count 0.</p>
  ${T.quiz ? '<div class="subnav"><button class="btn primary" id="newquiz">New random quiz</button></div>' : ''}
  <h3 style="margin-block:14px 8px">Tap a question to look at it again</h3>
  <div class="revgrid">${T.q.map((q, i) => {
    const a = R.ans[i]; const k = !a || a === 'skip' ? 'sk' : q.a.includes(a) ? 'ok' : 'no';
    return `<button class="rev ${k}" data-rev="${i}"><b>${i + 1}</b> · ${k === 'sk' ? 'blank' : a} ${k === 'no' ? '→ ' + q.a : ''}</button>`;
  }).join('')}</div>
  <div class="subnav" style="margin-top:20px"><button class="btn" id="home2">All papers</button><button class="btn danger" id="retake">Retake this paper</button></div>`;
  app.querySelector('#back').onclick = home; app.querySelector('#home2').onclick = home;
  const nq = app.querySelector('#newquiz'); if (nq) nq.onclick = () => { prefs.level = T.level; save('kg:prefs', prefs); home(); app.querySelector('#qgo').click(); };
  app.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { qi = +b.dataset.rev; review = true; renderQ(); });
  const rt = app.querySelector('#retake');
  rt.onclick = () => {
    if (!rt.dataset.arm) { rt.dataset.arm = 1; rt.textContent = 'Tap again: clears answers (notes stay)'; return; }
    prog[T.id] = Object.assign(T.quiz ? { level: R.level, items: R.items } : {}, { ans: {}, done: false, elapsed: 0, mode: prefs.mode }); saveProg(); openTest(T.id, 0);
  };
  window.scrollTo(0, 0);
}

// deep link from the study guide: #2016_Felix-q3 opens that paper at that question
const deep = /^#(\d{4}_[A-Za-z]+)-q(\d+)$/.exec(location.hash || '');
if (deep && BY_ID[deep[1]] && +deep[2] >= 1 && +deep[2] <= BY_ID[deep[1]].q.length) {
  prefs.level = BY_ID[deep[1]].level; openTest(deep[1], +deep[2] - 1);
} else if (location.hash === '#sample') openTest('2024_Ecolier', 3); else home();
})();
</script>
